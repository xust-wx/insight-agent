services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insight-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DB:-olist}
      POSTGRES_USER: ${PG_ADMIN_USER:-olist_admin}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-olist_admin} -d ${PG_DB:-olist}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
